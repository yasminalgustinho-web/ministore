{% extends 'base.html' %}

{% block title %}{{ 'Editar Categoria' if categoria else 'Nova Categoria' }} — MiniStore{% endblock %}

{% block content %}
<h2>{{ 'Editar Categoria' if categoria else 'Nova Categoria' }}</h2>

<form method="POST" class="formulario">
    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" value="{{ categoria.nome if categoria else '' }}" required>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4">{{ categoria.descricao if categoria else '' }}</textarea>
    </div>

    <div class="form-botoes">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{{ url_for('categorias.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
